<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Second-hand Book - Bellbird Books</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="nav-container">

            <div class="logo">
                Bellbird Books
            </div>

            <nav>
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('search_stock') }}">Stock</a>
                <a href="{{ url_for('add_stock') }}">Add Stock</a>
                <a href="{{ url_for('second_hand') }}">Second-hand</a>
                <a href="{{ url_for('add_order') }}">New Order</a>
                <a href="{{ url_for('view_orders') }}">Orders</a>
            </nav>

        </div>

    </header>


    <main class="container">

        <div class="page-header">

            <div>
                <h1>Add Second-hand Book</h1>

                <p>
                    Record one physical second-hand book copy.
                </p>
            </div>

        </div>


        <div class="card">

            <form method="POST">

                <div class="form-group">

                    <label for="title">
                        Title *
                    </label>

                    <input type="text" id="title" name="title" required>

                </div>


                <div class="form-group">

                    <label for="author">
                        Author *
                    </label>

                    <input type="text" id="author" name="author" required>

                </div>


                <div class="form-group">

                    <label for="condition">
                        Condition *
                    </label>

                    <select id="condition" name="condition" required>

                        <option value="">
                            Select condition
                        </option>

                        <option value="As New">
                            As New
                        </option>

                        <option value="Very Good">
                            Very Good
                        </option>

                        <option value="Good">
                            Good
                        </option>

                        <option value="Fair">
                            Fair
                        </option>

                        <option value="Reading Copy">
                            Reading Copy
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="source">
                        Source
                    </label>

                    <input type="text" id="source" name="source" placeholder="Seller, donation, trade-in...">

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="cost">
                            Cost
                        </label>

                        <input type="number" id="cost" name="cost" step="0.01" min="0">

                    </div>


                    <div class="form-group">

                        <label for="price">
                            Selling Price
                        </label>

                        <input type="number" id="price" name="price" step="0.01" min="0">

                    </div>

                </div>


                <div class="form-group">

                    <label for="location">
                        Shelf Location *
                    </label>

                    <input type="text" id="location" name="location" placeholder="Second-hand Shelf A" required>

                </div>


                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea id="notes" name="notes" rows="4"
                        placeholder="Additional notes about this copy..."></textarea>

                </div>


                <div class="form-actions">

                    <button type="submit" class="btn">
                        Add Book
                    </button>

                    <a href="{{ url_for('second_hand') }}" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer>
        Bellbird Books Management System
    </footer>

</body>

</html>
