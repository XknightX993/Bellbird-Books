<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Second-hand Book - Bellbird Books</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header class="navbar">

        <div class="nav-container">

            <div class="logo">
                Bellbird Books
            </div>

            <nav>

                <a href="{{ url_for('home') }}">
                    Home
                </a>

                <a href="{{ url_for('search_stock') }}">
                    Stock
                </a>

                <a href="{{ url_for('add_stock') }}">
                    Add Stock
                </a>

                <a href="{{ url_for('second_hand') }}">
                    Second-hand
                </a>

                <a href="{{ url_for('add_order') }}">
                    New Order
                </a>

                <a href="{{ url_for('view_orders') }}">
                    Orders
                </a>

            </nav>

        </div>

    </header>


    <main class="container">

        <div class="page-header">

            <div>

                <h1>
                    Edit Second-hand Book
                </h1>

                <p>
                    Update this individual book copy.
                </p>

            </div>

        </div>


        <div class="card">

            <form method="POST">

                <div class="form-group">

                    <label>
                        Title *
                    </label>

                    <input type="text" name="title" value="{{ stock.title }}" required>

                </div>


                <div class="form-group">

                    <label>
                        Author *
                    </label>

                    <input type="text" name="author" value="{{ stock.author }}" required>

                </div>


                <div class="form-group">

                    <label>
                        Condition *
                    </label>

                    <select name="condition" required>

                        <option value="As New" {% if stock.condition=="As New" %} selected {% endif %}>
                            As New
                        </option>

                        <option value="Very Good" {% if stock.condition=="Very Good" %} selected {% endif %}>
                            Very Good
                        </option>

                        <option value="Good" {% if stock.condition=="Good" %} selected {% endif %}>
                            Good
                        </option>

                        <option value="Fair" {% if stock.condition=="Fair" %} selected {% endif %}>
                            Fair
                        </option>

                        <option value="Reading Copy" {% if stock.condition=="Reading Copy" %} selected {% endif %}>
                            Reading Copy
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Source
                    </label>

                    <input type="text" name="source" value="{{ stock.source or '' }}">

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Cost
                        </label>

                        <input type="number" name="cost" step="0.01" min="0" value="{{ stock.cost or '' }}">

                    </div>


                    <div class="form-group">

                        <label>
                            Selling Price
                        </label>

                        <input type="number" name="price" step="0.01" min="0" value="{{ stock.price or '' }}">

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Shelf Location *
                    </label>

                    <input type="text" name="location" value="{{ stock.location }}" required>

                </div>


                <div class="form-group">

                    <label>
                        Notes
                    </label>

                    <textarea name="notes" rows="4">{{ stock.notes or '' }}</textarea>

                </div>


                <div class="form-actions">

                    <button type="submit" class="btn">
                        Save Changes
                    </button>

                    <a href="{{ url_for('second_hand') }}" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer>
        Bellbird Books Management System
    </footer>

</body>

</html>
