<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Customer Order - Bellbird Books</title>
</head>

<body>

    <h1>Add Customer Order</h1>

    <form method="POST">

        <h2>Customer Details</h2>

        <label for="name">Customer Name:</label><br>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="phone">Phone:</label><br>
        <input type="text" id="phone" name="phone" required>
        <br><br>

        <label for="contact_preference">Contact Preference:</label><br>
        <select id="contact_preference" name="contact_preference" required>
            <option value="Call">Call</option>
            <option value="Text">Text</option>
        </select>

        <h2>Order Details</h2>

        <label for="title">Book Title:</label><br>
        <input type="text" id="title" name="title" required>
        <br><br>

        <label for="author">Author:</label><br>
        <input type="text" id="author" name="author" required>
        <br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        <br><br>

        <label for="deposit">Deposit:</label><br>
        <input type="number" id="deposit" name="deposit" min="0" step="0.01" value="0">
        <br><br>

        <label for="order_date">Order Date:</label><br>
        <input type="date" id="order_date" name="order_date" required>
        <br><br>

        <label for="arrival_date">Arrival Date:</label><br>
        <input type="date" id="arrival_date" name="arrival_date">
        <br><br>

        <button type="submit">Create Order</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
