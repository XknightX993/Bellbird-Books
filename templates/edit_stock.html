<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Stock - Bellbird Books</title>
</head>

<body>

    <h1>Edit New Stock</h1>

    <form method="POST">

        <p>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ stock['title'] }}" required>
        </p>

        <p>
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" value="{{ stock['author'] }}" required>
        </p>

        <p>
            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn" value="{{ stock['isbn'] or '' }}">
        </p>

        <p>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="{{ stock['quantity'] }}" min="0">
        </p>

        <p>
            <label for="cost">Cost:</label>
            <input type="number" id="cost" name="cost" value="{{ stock['cost'] or '' }}" step="0.01" min="0">
        </p>

        <p>
            <label for="price">Price:</label>
            <input type="number" id="price" name="price" value="{{ stock['price'] or '' }}" step="0.01" min="0">
        </p>

        <p>
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" value="{{ stock['location'] }}" required>
        </p>

        <button type="submit">Save Changes</button>

    </form>

    <p>
        <a href="{{ url_for('search_stock') }}">Back to Search</a>
    </p>

</body>

</html>
